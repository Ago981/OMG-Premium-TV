# OMG Premium TV — addon + PostgreSQL + Cloudflare WARP (+ Cloudflare Tunnel facoltativo)
#
# Avvio immediato, senza configurare nulla:   docker compose up -d
#   → addon su http://<server>:10000, database PostgreSQL già pronto, uscita da WARP.
# Personalizzazioni (facoltative): copia .env.example in .env e modifica i valori.
#
# - In entrata, con Cloudflare Tunnel: metti CLOUDFLARE_TUNNEL_TOKEN e ADDON_BIND=127.0.0.1 nel .env
#   e avvia con   docker compose --profile tunnel up -d   (la porta 10000 non è più raggiungibile da fuori).
# - In uscita: tutto ciò che scarica il server (playlist senza proxy, EPG, verifiche, richieste ai
#   proxy degli utenti) passa da WARP. Se WARP non funziona i download falliscono: il server non esce
#   mai con il tuo IP (OUTBOUND_PROXY_REQUIRED=true).

services:
  addon:
    build: .
    image: omg-premium-tv:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Database incluso nello stack (servizio "db"), raggiungibile solo dalla rete interna di Docker
      DATABASE_URL: postgres://omg:${POSTGRES_PASSWORD:-omg-premium-tv}@db:5432/omg
      DATA_DIR: /app/data
      # Script Python (generatore playlist e resolver) disattivati: eseguono codice scaricato da URL
      # sul server. Per attivarli metti PYTHON_ENABLED=true nel file .env
      PYTHON_ENABLED: ${PYTHON_ENABLED:-false}
      # Uscita del server da Cloudflare WARP (servizio "warp" qui sotto)
      OUTBOUND_PROXY: ${OUTBOUND_PROXY:-http://warp:8080}
      OUTBOUND_PROXY_REQUIRED: ${OUTBOUND_PROXY_REQUIRED:-true}
    volumes:
      - addon-data:/app/data
    depends_on:
      db:
        condition: service_healthy
      warp:
        condition: service_started
    ports:
      # ADDON_BIND=127.0.0.1 nel .env per renderlo raggiungibile solo dal tunnel / reverse proxy locale
      - "${ADDON_BIND:-0.0.0.0}:${ADDON_PORT:-10000}:10000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: omg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omg-premium-tv}
      POSTGRES_DB: omg
    # Nessuna porta pubblicata: il database è visibile solo agli altri container dello stack
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omg -d omg"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cloudflare WARP in userspace (wireproxy): proxy SOCKS5 :1080 e HTTP :8080 solo sulla rete interna.
  # Al primo avvio registra un dispositivo WARP gratuito e salva il profilo nel volume.
  warp:
    build: ./warp
    image: omg-warp:latest
    restart: unless-stopped
    environment:
      WARP_LICENSE_KEY: ${WARP_LICENSE_KEY:-}
    volumes:
      - warp-data:/data

  # Esempio: MediaFlow Proxy che esce anch'esso da WARP (decommenta se lo usi)
  # mediaflow:
  #   image: mhdzumair/mediaflow-proxy:latest
  #   restart: unless-stopped
  #   environment:
  #     API_PASSWORD: ${MEDIAFLOW_PASSWORD}
  #     PROXY_URL: socks5://warp:1080
  #     ALL_PROXY: "true"
  #   depends_on:
  #     - warp

  # Cloudflare Tunnel (facoltativo, profilo "tunnel"): nel pannello Zero Trust crea un tunnel,
  # imposta come servizio http://addon:10000 sul tuo hostname pubblico e metti il token nel .env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - addon

volumes:
  addon-data:
  db-data:
  warp-data:

services:
  - type: web
    name: OMG-TV
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: omg-tv-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: omg-tv-db
    plan: free
    region: frankfurt
